<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Waterfall vs Bad Agile vs Real Agile</title>
  <desc id="desc">A year-timeline joke: waterfall dumps one giant mess at the end, bad agile grows the mess over months, real agile deals with small messes continuously.</desc>
