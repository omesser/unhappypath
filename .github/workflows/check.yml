name: check

# ADR-0005: Cloudflare Pages owns deployment. This workflow only reports whether
# a PR builds cleanly — it never deploys, and holds no Cloudflare credentials.
on:
  pull_request:

# Read-only: the job builds and inspects the tree, and writes nothing back.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # ADR-0005: `22` floats to the newest 22.x patch. Without check-latest the
          # runner's cached 22.x wins, which can lag a patch Astro requires.
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check
