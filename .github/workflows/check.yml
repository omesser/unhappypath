name: check

# ADR-0005: Cloudflare Pages owns deployment. This workflow only reports whether
# a PR builds cleanly — it never deploys, and holds no Cloudflare credentials.
on:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
