version: 2

updates:
  - directory: '/'
    package-ecosystem: 'npm'
    schedule:
      interval: 'weekly'
    labels:
      - 'maintenance'
    ignore:
      # TS 7: wait for @astrojs/check to accept it (peer ^5 || ^6 as of 0.9.12).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - directory: '/'
    package-ecosystem: 'github-actions'
    schedule:
      interval: 'weekly'
    labels:
      - 'maintenance'
